name: Update municipal stats

on:
  schedule:
    # 毎週月曜 12:00 JST (03:00 UTC)
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require ESTAT_APP_ID
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          if [ -z "$ESTAT_APP_ID" ]; then
            echo "::error::Secret ESTAT_APP_ID が未設定です。https://www.e-stat.go.jp/api/ で発行し、リポジトリ Secrets に追加してください。"
            exit 1
          fi

      - name: Refresh nationwide municipality base
        run: node scripts/build-nationwide-base.mjs

      - name: Fetch latest stats from e-Stat
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: node scripts/update-municipal-stats.mjs

      - name: Commit if changed
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_stats() {
            if git diff --quiet -- data/municipalities.base.json data/municipalities.stats.json src/data/municipalities.generated.json; then
              echo "No stats changes"
              return 1
            fi
            git add data/municipalities.base.json data/municipalities.stats.json src/data/municipalities.generated.json
            # 既に同内容のコミットがある場合は作り直さない
            if git diff --cached --quiet; then
              return 1
            fi
            git commit -m "chore: update municipal stats from e-Stat"
            return 0
          }

          # 生成JSONは rebase すると必ず衝突するので、失敗時は最新 main で再生成する
          for i in 1 2 3; do
            if ! commit_stats; then
              echo "Nothing to push"
              exit 0
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected; regenerate on origin/main (try $i)"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            node scripts/build-nationwide-base.mjs
            node scripts/update-municipal-stats.mjs
          done
          echo "::error::push failed after regenerate retries"
          exit 1
